[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arize-assistant"
version = "0.1.0"
description = "ARIZE — a private AI assistant that runs on your own computer, with tools and long-term memory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
arize = "arize_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arize_assistant"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
