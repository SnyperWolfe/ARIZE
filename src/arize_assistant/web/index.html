<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARIZE</title>
<link rel="icon" href="/icon.png">
<style>
  :root {
    --bg: #04070c;
    --panel: rgba(14, 26, 38, 0.72);
    --line: rgba(80, 210, 255, 0.18);
    --cyan: #46dcff;
    --cyan-soft: rgba(70, 220, 255, 0.55);
    --amber: #ffb547;
    --red: #ff5a6a;
    --text: #d8f3ff;
    --muted: #6f8ea0;
    --hud: "Bahnschrift", "DIN Alternate", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", "Consolas", "SF Mono", ui-monospace, monospace;
    --accent: var(--cyan);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(ellipse at 28% 40%, rgba(40, 140, 200, 0.16), transparent 60%),
      linear-gradient(rgba(70, 220, 255, 0.035) 1px, transparent 1px) 0 0 / 100% 4px,
      var(--bg);
    color: var(--text);
    font: 15px/1.55 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  body.state-tool { --accent: var(--amber); }
  body.state-listening { --accent: var(--red); }
  button { font: inherit; color: inherit; cursor: pointer; }

  .app { display: grid; grid-template-columns: minmax(300px, 38%) 1fr; height: 100vh; }

  /* ---- left: the core ---- */
  .core-side {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-right: 1px solid var(--line); position: relative; padding: 24px; min-width: 0;
  }
  .brand {
    position: absolute; top: 20px; left: 24px; font-family: var(--hud);
    letter-spacing: 0.5em; font-size: 20px; color: var(--cyan);
    text-shadow: 0 0 12px var(--cyan-soft);
  }
  .brand small { display: block; letter-spacing: 0.25em; font-size: 10px; color: var(--muted); }
  .core { width: min(78%, 360px); aspect-ratio: 1; position: relative; }
  .core svg { width: 100%; height: 100%; overflow: visible; }
  .core .r { fill: none; stroke: var(--accent); transform-origin: 200px 200px;
             transition: stroke 0.4s; filter: drop-shadow(0 0 6px var(--accent)); }
  .r1 { stroke-width: 7; stroke-dasharray: 26 14; animation: spin 40s linear infinite; }
  .r2 { stroke-width: 1.5; opacity: 0.6; }
  .r3 { stroke-width: 11; stroke-dasharray: 150 70; animation: spin 18s linear infinite reverse; }
  .r4 { stroke-width: 2; stroke-dasharray: 3 9; opacity: 0.8; animation: spin 60s linear infinite; }
  .r5 { stroke-width: 5; }
  .mark { fill: none; stroke: #e6fbff; stroke-width: 6; stroke-linejoin: round;
          filter: drop-shadow(0 0 8px var(--accent)); }
  .glow { fill: var(--accent); opacity: 0.22; transform-origin: 200px 200px;
          animation: breathe 4s ease-in-out infinite; transition: fill 0.4s; }
  body.state-thinking .r1 { animation-duration: 6s; }
  body.state-thinking .r3 { animation-duration: 2.4s; }
  body.state-thinking .glow { animation-duration: 1.1s; opacity: 0.4; }
  body.state-tool .r3 { animation-duration: 3s; }
  body.state-speaking .glow { animation-duration: 0.6s; opacity: 0.45; }
  body.state-listening .glow { animation-duration: 0.9s; opacity: 0.45; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { transform: scale(1.35); opacity: 0.06; } }

  .status {
    margin-top: 26px; font-family: var(--hud); letter-spacing: 0.35em; font-size: 13px;
    color: var(--accent); text-shadow: 0 0 10px var(--accent); text-transform: uppercase;
    text-align: center; min-height: 1.6em; transition: color 0.4s;
  }
  .model { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-top: 6px; }
  .hudlog {
    position: absolute; left: 24px; right: 24px; bottom: 18px; font-family: var(--mono);
    font-size: 11px; color: var(--muted); max-height: 22vh; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
    mask-image: linear-gradient(transparent, #000 40%);
  }
  .hudlog div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hudlog .ok { color: #6fe3a7; }
  .hudlog .err { color: var(--red); }

  /* ---- right: conversation ---- */
  .chat-side { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  .topbar {
    display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .chip {
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-family: var(--hud); font-size: 12px; letter-spacing: 0.12em;
    color: var(--text); text-transform: uppercase;
  }
  .chip:hover { border-color: var(--cyan); color: var(--cyan); }
  .chip[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan);
                                box-shadow: 0 0 10px rgba(70, 220, 255, 0.25) inset; }

  .messages { flex: 1; overflow-y: auto; padding: 28px clamp(16px, 4vw, 48px); }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .greeting { margin-top: 18vh; text-align: center; }
  .greeting h1 { font-family: var(--hud); font-weight: 400; letter-spacing: 0.08em;
                 font-size: clamp(24px, 3vw, 34px); margin: 0 0 8px; }
  .greeting p { color: var(--muted); margin: 0 0 22px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

  .msg { max-width: 760px; margin: 0 auto 18px; }
  .msg.user .bubble {
    margin-left: auto; width: fit-content; max-width: 85%; background: rgba(70, 220, 255, 0.09);
    border: 1px solid var(--line); border-radius: 14px 14px 4px 14px; padding: 10px 14px;
  }
  .msg.bot .bubble { border-left: 2px solid var(--cyan); padding: 2px 0 2px 16px; }
  .msg.bot .who { font-family: var(--hud); letter-spacing: 0.3em; font-size: 11px;
                  color: var(--cyan); margin-bottom: 4px; }
  .msg.error .bubble { border-left-color: var(--red); color: #ffc3c9; }
  .bubble p { margin: 0 0 10px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble pre { background: rgba(0, 0, 0, 0.45); border: 1px solid var(--line); border-radius: 8px;
                padding: 10px 12px; overflow-x: auto; font: 13px/1.45 var(--mono); }
  .bubble code { font-family: var(--mono); font-size: 0.92em; background: rgba(70, 220, 255, 0.1);
                 padding: 1px 5px; border-radius: 4px; }
  .bubble pre code { background: none; padding: 0; }
  .bubble a { color: var(--cyan); }
  .bubble ul, .bubble ol { margin: 0 0 10px; padding-left: 22px; }
  .steps { font: 12px var(--mono); color: var(--muted); margin: 0 0 6px; }
  .steps div::before { content: "▸ "; color: var(--amber); }
  .cursor::after { content: "▍"; color: var(--cyan); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .composer { padding: 14px clamp(16px, 4vw, 48px) 20px; }
  .inputrow {
    max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px;
    backdrop-filter: blur(8px);
  }
  .inputrow:focus-within { border-color: var(--cyan-soft); box-shadow: 0 0 18px rgba(70, 220, 255, 0.12); }
  textarea {
    flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; padding: 8px 6px; max-height: 180px; min-height: 24px;
  }
  textarea::placeholder { color: var(--muted); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
    background: transparent; display: grid; place-items: center; flex: none;
  }
  .icon-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .icon-btn.send { background: var(--cyan); color: #022; border-color: var(--cyan); }
  .icon-btn.send:disabled { opacity: 0.35; cursor: default; }
  .icon-btn.mic.on { border-color: var(--red); color: var(--red); box-shadow: 0 0 12px rgba(255, 90, 106, 0.4); }
  .icon-btn svg { width: 20px; height: 20px; }
  .hint { max-width: 760px; margin: 6px auto 0; color: var(--muted); font-size: 11px; text-align: center; }

  /* ---- dialogs ---- */
  .overlay { position: fixed; inset: 0; background: rgba(2, 5, 9, 0.7); display: none;
             align-items: center; justify-content: center; padding: 16px; z-index: 10;
             backdrop-filter: blur(3px); }
  .overlay.open { display: flex; }
  .dialog { width: min(560px, 100%); max-height: 80vh; overflow: auto; background: #0a141e;
            border: 1px solid var(--line); border-radius: 16px; padding: 22px;
            box-shadow: 0 0 40px rgba(70, 220, 255, 0.12); }
  .dialog h2 { font-family: var(--hud); font-weight: 400; letter-spacing: 0.2em; font-size: 15px;
               margin: 0 0 14px; color: var(--cyan); text-transform: uppercase; }
  .dialog.warn h2 { color: var(--amber); }
  .dialog pre { white-space: pre-wrap; word-break: break-word; font: 13px/1.5 var(--mono);
                background: rgba(0, 0, 0, 0.4); border: 1px solid var(--line); border-radius: 8px;
                padding: 12px; margin: 0 0 18px; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; }
  .btn { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 18px; }
  .btn.primary { background: var(--amber); color: #201300; border-color: var(--amber); font-weight: 600; }
  .memlist { list-style: none; padding: 0; margin: 0 0 16px; }
  .memlist li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0;
                border-bottom: 1px solid var(--line); }
  .memlist li span { flex: 1; }
  .memlist small { color: var(--muted); font-family: var(--mono); }
  .memlist button { background: none; border: 0; color: var(--muted); }
  .memlist button:hover { color: var(--red); }
  .empty { color: var(--muted); }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .core-side { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row;
                 gap: 16px; justify-content: flex-start; padding: 12px 16px; }
    .brand { position: static; font-size: 16px; }
    .core { width: 64px; }
    .status { margin: 0; font-size: 11px; text-align: left; white-space: nowrap; letter-spacing: 0.2em; }
    .model, .hudlog { display: none; }
    .chat-side { height: auto; min-height: 0; }
    .app { height: 100vh; }
    .greeting { margin-top: 8vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body class="state-idle">
<div class="app">
  <section class="core-side" aria-label="ARIZE status">
    <div class="brand">ARIZE<small>PERSONAL ASSISTANT</small></div>
    <div class="core" aria-hidden="true">
      <svg viewBox="0 0 400 400">
        <circle class="glow" cx="200" cy="200" r="70"/>
        <circle class="r r1" cx="200" cy="200" r="186"/>
        <circle class="r r2" cx="200" cy="200" r="160"/>
        <circle class="r r3" cx="200" cy="200" r="134"/>
        <circle class="r r4" cx="200" cy="200" r="104"/>
        <circle class="r r5" cx="200" cy="200" r="66"/>
        <path class="mark" d="M200 152 L242 232 L158 232 Z M178 208 H222"/>
      </svg>
    </div>
    <div>
      <div class="status" id="status" role="status" aria-live="polite">Starting up</div>
      <div class="model" id="model"></div>
    </div>
    <div class="hudlog" id="hudlog" aria-hidden="true"></div>
  </section>

  <section class="chat-side">
    <div class="topbar">
      <button class="chip" id="voiceBtn" aria-pressed="false" title="Read answers out loud">Voice off</button>
      <button class="chip" id="memBtn">Memories</button>
      <button class="chip" id="newBtn">New chat</button>
    </div>
    <div class="messages" id="messages" aria-live="polite">
      <div class="greeting" id="greeting">
        <h1 id="hello">Hello.</h1>
        <p>What can I do for you?</p>
        <div class="suggestions">
          <button class="chip" data-q="What's in the news today?">Today's news</button>
          <button class="chip" data-q="What do you remember about me?">What do you know about me?</button>
          <button class="chip" data-q="What files are in my Documents folder?">My documents</button>
        </div>
      </div>
    </div>
    <div class="composer">
      <div class="inputrow">
        <textarea id="input" rows="1" placeholder="Message ARIZE…" aria-label="Message ARIZE"></textarea>
        <button class="icon-btn mic" id="micBtn" aria-label="Speak" title="Speak">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="icon-btn send" id="sendBtn" aria-label="Send" title="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line · Esc stops speaking</div>
    </div>
  </section>
</div>

<div class="overlay" id="confirmBox" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="dialog warn">
    <h2 id="confirmTitle">Permission needed</h2>
    <pre id="confirmText"></pre>
    <div class="actions">
      <button class="btn" id="denyBtn">Deny</button>
      <button class="btn primary" id="allowBtn">Allow</button>
    </div>
  </div>
</div>

<div class="overlay" id="memBox" role="dialog" aria-modal="true" aria-labelledby="memTitle">
  <div class="dialog">
    <h2 id="memTitle">What ARIZE remembers</h2>
    <ul class="memlist" id="memList"></ul>
    <div class="actions"><button class="btn" id="memClose">Close</button></div>
  </div>
</div>

<script>
const TOKEN = "__ARIZE_TOKEN__";
const $ = (id) => document.getElementById(id);
const els = {
  messages: $("messages"), input: $("input"), send: $("sendBtn"), mic: $("micBtn"),
  status: $("status"), hud: $("hudlog"), greeting: $("greeting"),
};
let busy = false;
let voiceOn = false;
try { voiceOn = localStorage.getItem("arize-voice") === "1"; } catch {}

const TOOL_LABELS = {
  web_search: "Searching the web", read_webpage: "Reading a page", read_file: "Reading a file",
  list_folder: "Looking at files", write_file: "Writing a file", run_command: "Running a command",
  remember: "Saving a memory", search_memory: "Searching memory", forget: "Forgetting",
};

function api(path, opts = {}) {
  return fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", "X-Arize-Token": TOKEN, ...(opts.headers || {}) },
  });
}

function setState(state, text) {
  document.body.className = "state-" + state;
  els.status.textContent = text;
}

function hud(text, cls = "") {
  const d = document.createElement("div");
  d.textContent = new Date().toLocaleTimeString([], { hour12: false }) + "  " + text;
  if (cls) d.className = cls;
  els.hud.appendChild(d);
  while (els.hud.children.length > 40) els.hud.firstChild.remove();
}

// --- tiny, safe markdown: escape first, then add formatting ----------------------
function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function markdown(src) {
  const parts = src.split(/```[\w-]*\n?/);
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2) { html += "<pre><code>" + esc(part.replace(/\n$/, "")) + "</code></pre>"; return; }
    const blocks = part.split(/\n{2,}/);
    for (const block of blocks) {
      if (!block.trim()) continue;
      const lines = block.split("\n");
      if (lines.every((l) => /^\s*[-*•]\s+/.test(l) || !l.trim())) {
        html += "<ul>" + lines.filter((l) => l.trim()).map((l) => "<li>" + inline(esc(l.replace(/^\s*[-*•]\s+/, ""))) + "</li>").join("") + "</ul>";
      } else if (lines.every((l) => /^\s*\d+[.)]\s+/.test(l) || !l.trim())) {
        html += "<ol>" + lines.filter((l) => l.trim()).map((l) => "<li>" + inline(esc(l.replace(/^\s*\d+[.)]\s+/, ""))) + "</li>").join("") + "</ol>";
      } else {
        const text = lines.map((l) => l.replace(/^#{1,6}\s+(.*)$/, "**$1**")).join("\n");
        html += "<p>" + inline(esc(text)).replace(/\n/g, "<br>") + "</p>";
      }
    }
  });
  return html;
}

function addMessage(kind, text = "") {
  els.greeting.style.display = "none";
  const msg = document.createElement("div");
  msg.className = "msg " + kind;
  if (kind !== "user") {
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = "ARIZE";
    msg.appendChild(who);
  }
  const steps = document.createElement("div");
  steps.className = "steps";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (kind === "user") bubble.textContent = text; else bubble.innerHTML = markdown(text);
  msg.append(steps, bubble);
  els.messages.appendChild(msg);
  scrollDown();
  return { msg, steps, bubble };
}
function scrollDown() { els.messages.scrollTop = els.messages.scrollHeight; }

// --- sending -----------------------------------------------------------------
async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  stopSpeaking();
  busy = true;
  els.input.value = "";
  autosize();
  updateSend();
  addMessage("user", text);
  const out = addMessage("bot");
  out.bubble.classList.add("cursor");
  let answer = "";
  setState("thinking", "Thinking");
  hud("> " + text.slice(0, 80));
  try {
    const res = await api("/api/chat", { method: "POST", body: JSON.stringify({ message: text }) });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "HTTP " + res.status);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl);
        buf = buf.slice(nl + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "token") {
          if (!answer) setState("thinking", "Responding");
          answer += ev.text;
          out.bubble.innerHTML = markdown(answer);
          scrollDown();
        } else if (ev.type === "tool") {
          answer = "";
          out.bubble.innerHTML = "";
          const label = TOOL_LABELS[ev.name] || ev.name;
          setState("tool", label);
          const step = document.createElement("div");
          step.textContent = label + describeArgs(ev.args);
          out.steps.appendChild(step);
          hud(ev.name + " " + ev.args.slice(0, 90));
          scrollDown();
        } else if (ev.type === "result") {
          hud("  " + (ev.ok ? "ok" : ev.preview.split("\n")[0]), ev.ok ? "ok" : "err");
          setState("thinking", "Thinking");
        } else if (ev.type === "confirm") {
          setState("tool", "Waiting for you");
          askPermission(ev.id, ev.text);
        } else if (ev.type === "done") {
          answer = ev.text || answer;
          out.bubble.innerHTML = markdown(answer || "(no answer)");
        } else if (ev.type === "error") {
          throw new Error(ev.text);
        }
      }
    }
    out.bubble.classList.remove("cursor");
    hud("answer ready", "ok");
    if (voiceOn && answer) speak(answer); else setState("idle", "Standing by");
  } catch (err) {
    out.bubble.classList.remove("cursor");
    out.msg.classList.add("error");
    out.bubble.textContent = String(err.message || err);
    hud("error: " + String(err.message || err).slice(0, 90), "err");
    setState("idle", "Standing by");
  } finally {
    busy = false;
    updateSend();
    els.input.focus();
  }
}

function describeArgs(json) {
  try {
    const a = JSON.parse(json);
    const v = a.query || a.url || a.path || a.command || a.fact;
    return v ? ": " + String(v).slice(0, 80) : "";
  } catch { return ""; }
}

// --- permission prompt ----------------------------------------------------------
function askPermission(id, text) {
  $("confirmText").textContent = text;
  $("confirmBox").classList.add("open");
  $("allowBtn").focus();
  const answer = async (allow) => {
    $("confirmBox").classList.remove("open");
    $("allowBtn").onclick = $("denyBtn").onclick = null;
    hud(allow ? "  allowed" : "  denied", allow ? "ok" : "err");
    setState("thinking", "Thinking");
    await api("/api/confirm", { method: "POST", body: JSON.stringify({ id, allow }) });
  };
  $("allowBtn").onclick = () => answer(true);
  $("denyBtn").onclick = () => answer(false);
}

// --- memories -----------------------------------------------------------------
async function showMemories() {
  const list = $("memList");
  list.innerHTML = "";
  const mems = await (await api("/api/memories")).json();
  if (!mems.length) list.innerHTML = '<li class="empty">Nothing yet. Tell ARIZE about yourself and it will remember.</li>';
  for (const m of mems) {
    const li = document.createElement("li");
    const span = document.createElement("span");
    span.textContent = m.text;
    const small = document.createElement("small");
    small.textContent = m.created.slice(0, 10);
    const del = document.createElement("button");
    del.textContent = "✕";
    del.title = "Forget this";
    del.setAttribute("aria-label", "Forget: " + m.text);
    del.onclick = async () => {
      await api("/api/memories/delete", { method: "POST", body: JSON.stringify({ id: m.id }) });
      li.remove();
      hud("forgot memory #" + m.id);
    };
    li.append(span, small, del);
    list.appendChild(li);
  }
  $("memBox").classList.add("open");
  $("memClose").focus();
}

// --- voice: speaking -------------------------------------------------------------
let voice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  const prefs = [/Ryan|George|Thomas/i, /UK English Male/i, /en-GB/i, /Guy|Christopher|David|Daniel/i, /^en/i];
  for (const p of prefs) {
    const v = voices.find((v) => p.test(v.name) || p.test(v.lang));
    if (v) return v;
  }
  return voices[0] || null;
}
if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); };
  voice = pickVoice();
}
function speak(text) {
  if (!("speechSynthesis" in window)) return setState("idle", "Standing by");
  const plain = text.replace(/```[\s\S]*?```/g, " (code shown on screen) ")
    .replace(/https?:\/\/\S+/g, " link ").replace(/[*_`#>\[\]()]/g, "");
  const u = new SpeechSynthesisUtterance(plain);
  if (voice) u.voice = voice;
  u.rate = 1.03;
  u.onstart = () => setState("speaking", "Speaking");
  u.onend = u.onerror = () => { if (!busy) setState("idle", "Standing by"); };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function stopSpeaking() {
  if ("speechSynthesis" in window && speechSynthesis.speaking) speechSynthesis.cancel();
}
function renderVoiceBtn() {
  const b = $("voiceBtn");
  b.setAttribute("aria-pressed", String(voiceOn));
  b.textContent = voiceOn ? "Voice on" : "Voice off";
}

// --- voice: listening ------------------------------------------------------------
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function toggleMic() {
  if (!Recognition) {
    hud("voice input isn't supported in this browser", "err");
    els.mic.title = "Voice input needs Edge or Chrome";
    return;
  }
  if (rec) { rec.stop(); return; }
  stopSpeaking();
  rec = new Recognition();
  rec.lang = navigator.language || "en-US";
  rec.interimResults = true;
  let finalText = "";
  rec.onstart = () => { els.mic.classList.add("on"); setState("listening", "Listening"); };
  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    els.input.value = (finalText + interim).trim();
    autosize(); updateSend();
  };
  rec.onerror = (e) => hud("mic: " + e.error, "err");
  rec.onend = () => {
    els.mic.classList.remove("on");
    rec = null;
    if (!busy) setState("idle", "Standing by");
    if (finalText.trim()) send(finalText);
  };
  rec.start();
}

// --- input box ------------------------------------------------------------------
function autosize() {
  els.input.style.height = "auto";
  els.input.style.height = Math.min(els.input.scrollHeight, 180) + "px";
}
function updateSend() { els.send.disabled = busy || !els.input.value.trim(); }

els.input.addEventListener("input", () => { autosize(); updateSend(); });
els.input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(els.input.value); }
});
els.send.onclick = () => send(els.input.value);
els.mic.onclick = toggleMic;
$("memBtn").onclick = showMemories;
$("memClose").onclick = () => $("memBox").classList.remove("open");
$("newBtn").onclick = async () => {
  if (busy) return;
  stopSpeaking();
  await api("/api/new", { method: "POST" });
  els.messages.querySelectorAll(".msg").forEach((m) => m.remove());
  els.greeting.style.display = "";
  hud("new conversation");
  els.input.focus();
};
$("voiceBtn").onclick = () => {
  voiceOn = !voiceOn;
  try { localStorage.setItem("arize-voice", voiceOn ? "1" : "0"); } catch {}
  renderVoiceBtn();
  if (!voiceOn) stopSpeaking();
};
document.querySelectorAll("[data-q]").forEach((b) => (b.onclick = () => send(b.dataset.q)));
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  stopSpeaking();
  $("memBox").classList.remove("open");
});

// --- start-up -------------------------------------------------------------------
(async function init() {
  renderVoiceBtn();
  const h = new Date().getHours();
  $("hello").textContent = h < 5 ? "Working late?" : h < 12 ? "Good morning." : h < 18 ? "Good afternoon." : "Good evening.";
  try {
    const info = await (await api("/api/info")).json();
    $("model").textContent = "model " + info.model + (info.think ? " · thinking on" : "");
    setState("idle", "Online");
    hud("ARIZE v" + info.version + " online");
    setTimeout(() => { if (!busy) setState("idle", "Standing by"); }, 1800);
  } catch {
    setState("idle", "Offline");
  }
  setInterval(() => api("/api/ping").catch(() => setState("idle", "Offline")), 10000);
  els.input.focus();
})();
</script>
</body>
